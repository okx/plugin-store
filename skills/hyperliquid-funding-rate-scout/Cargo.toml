[package]
name = "hyperliquid-funding-rate-scout"
version = "1.0.0"
edition = "2021"
authors = ["Ritesh"]
description = "Scan Hyperliquid perpetual futures for extreme funding rate imbalances and generate mean reversion signal cards"
license = "MIT"

[[bin]]
name = "hyperliquid-funding-rate-scout"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.86"
serde = { version = "=1.0.193", features = ["derive"] }
serde_json = "=1.0.108"
clap = { version = "=4.4.18", features = ["derive"] }
chrono = { version = "=0.4.31", features = ["clock"], default-features = false }

[profile.release]
opt-level = 3
strip = true